services:
  - type: web
    name: ticket-booking-backend
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-booking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 60
      - key: HOLD_TTL_MINUTES
        value: 10
      - key: WAITLIST_OFFER_TTL_MINUTES
        value: 10
      - key: FRONTEND_URL
        value: https://your-frontend-url.vercel.app
      - key: EMAIL_PROVIDER
        value: ""
      - key: EMAIL_API_KEY
        value: ""
      - key: EMAIL_FROM
        value: ""

databases:
  - name: ticket-booking-db
    databaseName: ticket_booking
    user: ticket_booking_user
    plan: free